name: Lab 2 CI/CD

on:
  push:
    branches:
      - lab2
      - main
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2.yml'

permissions:
  contents: read

jobs:
  test:
    name: Build, test and coverage
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake gcovr llvm catch2
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Configure Lab 2
        run: |
          cmake \
            -S lab2 \
            -B lab2/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build Lab 2
        run: cmake --build lab2/build --parallel

      - name: Test Lab 2
        run: ctest --test-dir lab2/build --output-on-failure

      - name: Coverage Lab 2
        working-directory: lab2
        run: |
          gcovr \
            --root . \
            --object-directory build \
            --gcov-executable "$(brew --prefix llvm)/bin/llvm-cov gcov" \
            --filter 'src/.*' \
            --exclude 'tests/.*' \
            --exclude 'cli/.*' \
            --exclude 'build/.*' \
            --print-summary \
            --fail-under-line 90

  build:
    name: Build Lab 2 release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake catch2

      - name: Configure Lab 2 release
        run: |
          cmake \
            -S lab2 \
            -B lab2/release-build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Lab 2 CLI
        run: cmake --build lab2/release-build --target lab2_cli --parallel

      - name: Prepare release archive
        run: |
          mkdir -p release
          cp lab2/release-build/lab2_cli release/lab2_cli
          tar -czf lab2-macos.tar.gz -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab2-macos
          path: lab2-macos.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: lab2-macos
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab2-${{ github.run_number }}
          name: Lab 2 ${{ github.run_number }}
          generate_release_notes: true
          files: release/lab2-macos.tar.gz